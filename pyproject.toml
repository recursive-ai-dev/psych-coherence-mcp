[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "psych-coherence-mcp"
version = "1.0.0"
description = "A stateful MCP server for psychologically coherent, persona-driven dialogue"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "James" }]
keywords = ["mcp", "model-context-protocol", "conversation", "persona"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "mcp>=1.29,<2",
  "pydantic>=2.11,<3",
]

[project.urls]
Repository = "https://github.com/recursive-ai-dev/psych-coherence-mcp"

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
psych-coherence-mcp = "psych_coherence_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
psych_coherence_mcp = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src/psych_coherence_mcp"]
strict = true
warn_unreachable = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
